                          - heading "Qui peut être assistant médical ?" [level=1] [ref=e112]:
                            - generic [ref=e113]: Qui peut être assistant médical ?
                          - paragraph [ref=e114]:
                            - generic [ref=e115]: La fonction d'Assistant Médical est ouverte à un large éventail de profils. Elle peut être assurée par des aides-soignants, des infirmières, des secrétaires médicales, ou tout autre professionnel intéressé à suivre cette voie.
                            - generic [ref=e116]: La clé pour devenir un Assistant Médical est la formation, ou l'engagement à suivre une formation spécifique conduite en alternance, qui est également éligible à la Validation des Acquis de Compétences (VAE).
                            - generic [ref=e117]: Après l'embauche, les assistants médicaux ont 2 ans pour engager leur formation et 3 ans pour obtenir leur Certificat de Qualification Professionnelle (CQP) d'Assistant Médical. Les infirmiers, auxiliaires de puériculture, et aides-soignants déjà diplômés peuvent obtenir une attestation de Formation d'Adaptation à l'Emploi (FAE) dans le domaine de l'organisation et de la gestion administrative d'un cabinet médical.
                          - heading "Les missions de l'assistant médical ?" [level=1] [ref=e118]:
                            - generic [ref=e119]: Les missions de l'assistant médical ?
                          - generic:
                            - paragraph [ref=e120]:
                              - generic [ref=e121]: Les missions de l'Assistant Médical sont variées et adaptées à l'organisation de chaque cabinet médical.
                            - paragraph [ref=e122]:
                              - generic [ref=e123]: Ces missions permettent aux médecins, qu'ils soient généralistes ou spécialistes, de bénéficier d'un soutien précieux.
                            - paragraph [ref=e124]:
                              - generic [ref=e125]: "Les trois principaux types de missions sont les suivants :"
