                                - generic [ref=e142]: Missions de nature administrative
                              - paragraph [ref=e143]:
                                - generic [ref=e147]: Cela peut inclure l'accueil des patients, la gestion de leurs dossiers, et l'assistance dans la mise en place de la télémédecine au sein du cabinet.
                      - generic [ref=e148]:
