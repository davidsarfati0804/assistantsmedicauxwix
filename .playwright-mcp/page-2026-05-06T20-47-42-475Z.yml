    - generic [ref=e21]:
      - heading "Qui peut être assistant médical ?" [level=2] [ref=e22]
      - paragraph [ref=e23]: La fonction d'Assistant Médical est ouverte à un large éventail de profils. Elle peut être assurée par des aides-soignants, des infirmières, des secrétaires médicales, ou tout autre professionnel intéressé à suivre cette voie. La clé pour devenir un Assistant Médical est la formation, ou l'engagement à suivre une formation spécifique conduite en alternance, qui est également éligible à la Validation des Acquis de Compétences (VAE). Après l'embauche, les assistants médicaux ont 2 ans pour engager leur formation et 3 ans pour obtenir leur Certificat de Qualification Professionnelle (CQP) d'Assistant Médical. Les infirmiers, auxiliaires de puériculture, et aides-soignants déjà diplômés peuvent obtenir une attestation de Formation d'Adaptation à l'Emploi (FAE) dans le domaine de l'organisation et de la gestion administrative d'un cabinet médical.
    - generic [ref=e24]:
      - generic [ref=e25]:
        - heading "Les missions de l'assistant médical ?" [level=2] [ref=e26]
        - paragraph [ref=e27]: Les missions de l'Assistant Médical sont variées et adaptées à l'organisation de chaque cabinet médical.
        - paragraph [ref=e28]: Ces missions permettent aux médecins, qu'ils soient généralistes ou spécialistes, de bénéficier d'un soutien précieux.
        - paragraph [ref=e29]: "Les trois principaux types de missions sont les suivants :"
      - generic [ref=e30]:
        - generic [ref=e31]:
          - img "Missions de nature administrative" [ref=e32]
          - heading "Missions de nature administrative" [level=3] [ref=e33]
          - paragraph [ref=e34]: Cela peut inclure l'accueil des patients, la gestion de leurs dossiers, et l'assistance dans la mise en place de la télémédecine au sein du cabinet.
        - generic [ref=e35]:
          - img "Préparation et déroulement de la consultation" [ref=e36]
          - heading "Préparation et déroulement de la consultation" [level=3] [ref=e37]
          - paragraph [ref=e38]: L'Assistant Médical aide les patients à s'habiller et se déshabiller, prend des constantes telles que la tension artérielle, le poids et la taille, met à jour les dossiers des patients pour les dépistages et les vaccinations, recueille des informations utiles sur les modes de vie, et prépare et aide à la réalisation d'actes techniques.
        - generic [ref=e39]:
          - img "Missions d'organisation et de coordination" [ref=e40]
          - heading "Missions d'organisation et de coordination" [level=3] [ref=e41]
          - paragraph [ref=e42]: L'Assistant Médical peut jouer un rôle clé dans l'organisation de rendez-vous avec des spécialistes, d'admissions à l'hôpital, et de coordination avec d'autres professionnels de la santé, tels que les infirmières, les kinésithérapeutes, ou les sages-femmes.
