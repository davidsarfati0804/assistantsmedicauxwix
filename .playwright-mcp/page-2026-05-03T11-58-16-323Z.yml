    - generic [ref=e26]:
      - heading "Qui peut être assistant médical ?" [level=2] [ref=e27]
      - paragraph [ref=e28]: Le rôle d'Assistant Médical est accessible à différents profils professionnels, notamment les aides-soignants, les infirmières, les secrétaires médicales, et d'autres professionnels intéressés par ce poste.
      - paragraph [ref=e29]: "Une formation spécifique est requise :"
      - list [ref=e30]:
        - listitem [ref=e31]: Formation en alternance éligible à la VAE (Validation des Acquis de l'Expérience)
        - listitem [ref=e32]: Délai de 2 ans pour commencer la formation après l'embauche
        - listitem [ref=e33]: Délai de 3 ans pour obtenir le CQP (Certificat de Qualification Professionnelle)
      - paragraph [ref=e34]: Les infirmières, auxiliaires de puériculture et aides-soignantes diplômées ont la possibilité d'obtenir une attestation FAE (Formation d'Adaptation à l'Emploi) axée sur l'organisation et la gestion administrative du cabinet médical.
    - generic [ref=e37]:
      - generic [ref=e38]:
        - img "missions administratives" [ref=e39]
        - heading "Missions de nature administrative" [level=3] [ref=e40]
        - paragraph [ref=e41]: Cela peut inclure l'accueil des patients, la gestion de leurs dossiers, et l'assistance dans la mise en place de la télémédecine au sein du cabinet.
      - generic [ref=e42]:
        - img "préparation consultation" [ref=e43]
        - heading "Préparation et déroulement de la consultation" [level=3] [ref=e44]:
          - text: Préparation et déroulement
          - text: de la consultation
        - paragraph [ref=e45]: L'Assistant Médical aide les patients à s'habiller et se déshabiller, prend des constantes telles que la tension artérielle, le poids et la taille, met à jour les dossiers des patients pour les dépistages et les vaccinations, recueille des informations utiles sur les modes de vie, et prépare et aide à la réalisation d'actes techniques.
      - generic [ref=e46]:
        - img "organisation coordination" [ref=e47]
        - heading "Missions d'organisation et de coordination" [level=3] [ref=e48]:
          - text: Missions d'organisation
          - text: et de coordination
        - paragraph [ref=e49]: L'Assistant Médical peut jouer un rôle clé dans l'organisation de rendez-vous avec des spécialistes, d'admissions à l'hôpital, et de coordination avec d'autres professionnels de la santé, tels que les infirmières, les kinésithérapeutes, ou les sages-femmes.
