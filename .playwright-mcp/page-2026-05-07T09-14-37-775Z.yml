      - generic [ref=e154]:
        - paragraph [ref=e157]: UN NOUVEAU METIER AU COEUR DU PARCOURS DE SOINS
        - heading "Le CQP Assistant Médical" [level=2] [ref=e160]
        - generic [ref=e166]:
          - paragraph [ref=e167]:
            - generic [ref=e168]:
              - text: La création du métier d’assistant médical est la mesure phare du
              - strong [ref=e169]: plan de réforme du système de santé 2022.
              - text: Elle a pour objectif de libérer du temps de consultation pour les médecins et de répondre ainsi à la crise de la démographie médicale et de l’accès aux soins.
            - text: Ce métier va permettre de renforcer la qualité et la coordination des soins entre les différents acteurs de santé au bénéfice du patient.
          - paragraph [ref=e170]:
            - generic [ref=e171]:
              - text: La
              - strong [ref=e172]: CPNEFP des cabinets médicaux
              - text: a créé le Certificat de Qualification Professionnelle (CQP) ASSISTANT MÉDICAL, d’une part pour
              - strong [ref=e173]: répondre aux attentes du Plan « Ma santé 2022 »
              - text: ", en cadrant la formation des futurs assistants médicaux et permettre ainsi le développement de leurs compétences dans les meilleures conditions possibles, d’autre part pour permettre"
              - strong [ref=e174]: une reconnaissance des compétences acquises
              - text: de façon informelle pour certains salariés des cabinets médicaux et leur offrir une perspective d’évolution.
        - generic [ref=e176]:
          - paragraph [ref=e177]:
            - generic [ref=e178]: "Les éléments règlementaires afférents à l’encadrement législatif et règlementaires du métier d’assistant médical sont :"
