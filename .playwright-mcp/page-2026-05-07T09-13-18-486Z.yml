        - paragraph [ref=e107]: "CQP Assistant Médical : rentrée et remises de diplômes"
        - paragraph [ref=e108]:
          - text: Ce second semestre 2025 marque un temps fort pour
          - link "l’École CHEM des Assistants Médicaux" [ref=e109] [cursor=pointer]:
            - /url: https://devenirassistantemedicale.fr/
            - text: l’
            - strong [ref=e110]: École CHEM des Assistants Médicaux
          - text: ", avec une activité particulièrement dynamique. En quelques semaines seulement, ce sont"
          - strong [ref=e111]: 3 nouvelles promotions qui vont fait leur rentrée
          - text: à Vannes, Rennes et Rouen, tandis que
          - strong [ref=e112]: 3 autres promotions sur ces mêmes villes vont célébrer leur remise de diplômes
          - text: .
        - paragraph [ref=e113]: Une belle illustration de la vitalité de la formation et de l’engagement des médecins employeurs aux côtés de leurs futurs Assistants Médicaux.
        - paragraph [ref=e114]: Tour d’horizon sur l’actualité de l’Ecole CHEM !
        - heading "🎓 Une rentrée dynamique pour l’École CHEM" [level=2] [ref=e115]:
          - img "🎓" [ref=e116]
          - text: Une rentrée dynamique pour l’École CHEM
        - paragraph [ref=e117]:
          - text: Créée en 2021 par le CHEM Santé, l’
          - strong [ref=e118]: École CHEM
          - text: est l’un des rares organismes en France habilités à dispenser le
          - strong [ref=e119]: CQP Assistant Médical
          - text: ", une formation qualifiante reconnue au RNCP (Registre National des Certifications Professionnelles)."
        - paragraph [ref=e120]:
          - text: Présente en
          - strong [ref=e121]: Bretagne, Normandie et Hauts-de-France
          - text: ", elle accompagne depuis 4 ans le développement de ce métier clé du plan"
          - emphasis [ref=e122]: Ma Santé 2022
          - text: .
        - paragraph [ref=e123]:
          - text: Le
          - strong [ref=e124]: CQP Assistant Médical
          - text: se déroule sur
          - strong [ref=e125]: 8 mois en alternance
          - text: ":"
        - list [ref=e126]:
          - listitem [ref=e127]:
            - strong [ref=e128]: 2 jours de formation théorique
            - text: dispensés par des professionnels de santé,
          - listitem [ref=e129]:
            - strong [ref=e130]: 3 jours de pratique en cabinet médical
            - text: ", auprès d’un médecin généraliste ou spécialiste."
        - paragraph [ref=e131]: "Ce parcours professionnalisant permet aux stagiaires d’acquérir toutes les compétences nécessaires : accueil et suivi administratif des patients, aide à la consultation, hygiène et qualité, coordination des parcours de soins."
        - heading "Trois nouvelles rentrées à Vannes, Rennes et Rouen" [level=2] [ref=e132]
        - paragraph [ref=e133]: "Trois nouvelles promotions ouvrent :"
        - list [ref=e134]:
          - listitem [ref=e135]:
            - strong [ref=e136]: Vannes
            - text: accueille sa
            - strong [ref=e137]: 4ᵉ promotion
            - text: le
            - strong [ref=e138]: 18 septembre 2025
            - text: .
          - listitem [ref=e139]:
            - strong [ref=e140]: Rennes
            - text: fait sa
            - strong [ref=e141]: 7ᵉ rentrée
            - text: le
            - strong [ref=e142]: 25 septembre 2025
            - text: .
          - listitem [ref=e143]:
            - strong [ref=e144]: Rouen
            - text: lance sa
            - strong [ref=e145]: 4ᵉ promotion
            - text: le
            - strong [ref=e146]: 2 octobre 2025
            - text: .
        - paragraph [ref=e147]: Ces promotions confirment la dynamique de l’École CHEM et l’engouement croissant pour ce métier.
        - heading "Des remises de diplômes pour saluer la réussite" [level=2] [ref=e148]
        - paragraph [ref=e149]: "En parallèle, plusieurs promotions ont terminé leur parcours avec succès ! Nous organisons les remises de diplômes de :"
        - list [ref=e150]:
          - listitem [ref=e151]:
            - text: la
            - strong [ref=e152]: 3ᵉ promotion de Rouen
            - text: ","
          - listitem [ref=e153]:
            - text: la
            - strong [ref=e154]: 3ᵉ promotion de Vannes
            - text: ","
          - listitem [ref=e155]:
            - text: et la
            - strong [ref=e156]: 5ᵉ promotion de Rennes
            - text: .
        - paragraph [ref=e157]:
          - text: Ces cérémonies de
          - strong [ref=e158]: remise de diplômes
          - text: mettent à l’honneur le sérieux et l’engagement des assistants médicaux diplômés, mais aussi la confiance des médecins employeurs qui participent activement à cette nouvelle organisation des soins.
        - heading "Pourquoi recruter un Assistant Médical ?" [level=2] [ref=e159]
        - paragraph [ref=e160]:
          - text: Que vous soyez
          - strong [ref=e161]: médecin généraliste ou spécialiste
          - text: ", recruter un Assistant Médical présente de nombreux avantages :"
        - list [ref=e162]:
          - listitem [ref=e163]:
            - strong [ref=e164]: Libérer du temps médical
            - text: en déléguant des tâches administratives, organisationnelles ou techniques (prise de constantes, gestion des dossiers, suivi des courriers).
          - listitem [ref=e165]:
            - strong [ref=e166]: Fluidifier la prise en charge des patients
            - text: et réduire les délais de rendez-vous.
          - listitem [ref=e167]:
            - strong [ref=e168]: Améliorer la qualité du parcours de soins
            - text: en optimisant la préparation des consultations.
          - listitem [ref=e169]:
            - strong [ref=e170]: Renforcer l’attractivité du cabinet
            - text: en offrant un meilleur confort aux patients comme aux praticiens.
        - paragraph [ref=e171]: "Un atout organisationnel, mais aussi humain, qui permet aux médecins de se recentrer sur leur cœur de métier : le soin."
