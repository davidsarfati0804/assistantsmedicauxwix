      - paragraph [ref=e54]:
        - text: La
        - strong [ref=e55]: Validation des Acquis de l'Expérience (VAE)
        - text: permet d'obtenir le Certificat de Qualification Professionnelle (CQP) d'Assistant Médical en faisant reconnaître les compétences acquises au cours de votre expérience professionnelle — sans avoir à suivre une formation complète en alternance.
