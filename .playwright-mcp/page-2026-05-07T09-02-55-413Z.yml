    - generic [ref=e26]:
      - heading "Qui peut être assistant médical ?" [level=2] [ref=e27]
      - paragraph [ref=e28]: La fonction d'Assistant Médical est ouverte à un large éventail de profils. Elle peut être assurée par des aides-soignants, des infirmières, des secrétaires médicales, ou tout autre professionnel intéressé à suivre cette voie. La clé pour devenir un Assistant Médical est la formation, ou l'engagement à suivre une formation spécifique conduite en alternance, qui est également éligible à la Validation des Acquis de Compétences (VAE). Après l'embauche, les assistants médicaux ont 2 ans pour engager leur formation et 3 ans pour obtenir leur Certificat de Qualification Professionnelle (CQP) d'Assistant Médical. Les infirmiers, auxiliaires de puériculture, et aides-soignants déjà diplômés peuvent obtenir une attestation de Formation d'Adaptation à l'Emploi (FAE) dans le domaine de l'organisation et de la gestion administrative d'un cabinet médical.
    - generic [ref=e29]:
      - generic [ref=e30]:
        - heading "Les missions de l'assistant médical ?" [level=2] [ref=e31]
        - paragraph [ref=e32]: Les missions de l'Assistant Médical sont variées et adaptées à l'organisation de chaque cabinet médical.
        - paragraph [ref=e33]: Ces missions permettent aux médecins, qu'ils soient généralistes ou spécialistes, de bénéficier d'un soutien précieux.
        - paragraph [ref=e34]: "Les trois principaux types de missions sont les suivants :"
      - generic [ref=e35]:
        - generic [ref=e36]:
          - img "Missions de nature administrative" [ref=e38]
          - heading "Missions de nature administrative" [level=3] [ref=e39]
          - paragraph [ref=e40]: Cela peut inclure l'accueil des patients, la gestion de leurs dossiers, et l'assistance dans la mise en place de la télémédecine au sein du cabinet.
        - generic [ref=e41]:
          - img "Préparation et déroulement de la consultation" [ref=e43]
          - heading "Préparation et déroulement de la consultation" [level=3] [ref=e44]
          - paragraph [ref=e45]: L'Assistant Médical aide les patients à s'habiller et se déshabiller, prend des constantes telles que la tension artérielle, le poids et la taille, met à jour les dossiers des patients pour les dépistages et les vaccinations, recueille des informations utiles sur les modes de vie, et prépare et aide à la réalisation d'actes techniques.
        - generic [ref=e46]:
          - img "Missions d'organisation et de coordination" [ref=e48]
          - heading "Missions d'organisation et de coordination" [level=3] [ref=e49]
          - paragraph [ref=e50]: L'Assistant Médical peut jouer un rôle clé dans l'organisation de rendez-vous avec des spécialistes, d'admissions à l'hôpital, et de coordination avec d'autres professionnels de la santé, tels que les infirmières, les kinésithérapeutes, ou les sages-femmes.
    - generic [ref=e52]:
